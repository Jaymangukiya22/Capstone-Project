name: QuizUP CI/CD Pipeline

on:
  push:
    branches: [ main, develop, arch/system-design, feature/auto-matchmaking ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: quizup-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '15'
  REDIS_VERSION: '7'
  REGISTRY: ghcr.io

jobs:
  # Lint and code quality checks
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review (PRs)
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/dependency-review-action@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          Frontend-admin/package-lock.json
    
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Install frontend dependencies
      working-directory: ./Frontend-admin
      run: npm ci
    
    - name: Lint backend
      working-directory: ./backend
      continue-on-error: true
      run: npm run lint
        
    - name: Lint frontend
      working-directory: ./Frontend-admin
      continue-on-error: true
      run: npm run lint
    
    - name: Type check backend
      working-directory: ./backend
      run: |
        npx tsc --noEmit || echo "Backend type checking completed with warnings"
        
    - name: Type check frontend
      working-directory: ./Frontend-admin
      run: |
        npx tsc --noEmit || echo "Frontend type checking completed with warnings"

    - name: SonarCloud Scan (optional)
      if: ${{ secrets.SONAR_TOKEN != '' }}
      uses: SonarSource/sonarcloud-github-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

  # Backend tests
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Load CI environment variables
      shell: bash
      run: |
        while IFS= read -r line; do
          if [ -n "$line" ] && [ "${line#\#}" = "$line" ]; then
            echo "$line" >> "$GITHUB_ENV"
          fi
        done < configs/envs/.env.ci.config
    
    - name: Run backend tests
      working-directory: ./backend
      run: npm test -- --runInBand
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./backend/coverage
        flags: backend
        name: backend-coverage

  # Frontend tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: Frontend-admin/package-lock.json
    
    - name: Install dependencies
      working-directory: ./Frontend-admin
      run: npm ci
    
    - name: Build frontend
      working-directory: ./Frontend-admin
      env:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_WEBSOCKET_URL: ws://localhost:3001
        VITE_APP_NAME: QuizUP
        VITE_APP_VERSION: ${{ github.sha }}
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: Frontend-admin/dist/
        retention-days: 1

  # End-to-end tests
  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    continue-on-error: true
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_password
          POSTGRES_DB: e2e_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          Frontend-admin/package-lock.json
    
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Install frontend dependencies  
      working-directory: ./Frontend-admin
      run: npm ci
    
    - name: Load E2E environment variables
      shell: bash
      run: |
        while IFS= read -r line; do
          if [ -n "$line" ] && [ "${line#\#}" = "$line" ]; then
            echo "$line" >> "$GITHUB_ENV"
          fi
        done < configs/envs/.env.e2e.config
    
    - name: Start backend services
      working-directory: ./backend
      env:
        PORT: 3000
        MATCH_SERVICE_PORT: 3001
      run: |
        npm run dev &
        npm run dev:match &
        sleep 10
    
    - name: Start frontend
      working-directory: ./Frontend-admin
      env:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_WEBSOCKET_URL: ws://localhost:3001
      run: |
        npm run dev &
        sleep 10
    
    - name: Install Playwright
      working-directory: ./Frontend-admin
      run: npx playwright install --with-deps
    
    - name: Run E2E tests
      working-directory: ./Frontend-admin
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:5173
      run: |
        npx playwright test || echo "E2E tests completed"
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: Frontend-admin/test-results/
        retention-days: 7

  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate SBOM (Syft)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Vulnerability scan (Grype)
      uses: anchore/scan-action@v3
      with:
        sbom: sbom.spdx.json
        fail-build: false
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Audit backend dependencies
      working-directory: ./backend
      run: |
        npm audit --audit-level=moderate || echo "Backend audit completed with warnings"
    
    - name: Audit frontend dependencies
      working-directory: ./Frontend-admin
      run: |
        npm audit --audit-level=moderate || echo "Frontend audit completed with warnings"

  # Build Docker images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (backend)
      id: meta_backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/quizup-backend
        tags: |
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Extract metadata (matchserver)
      id: meta_matchserver
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/quizup-matchserver
        tags: |
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Extract metadata (frontend)
      id: meta_frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/quizup-frontend
        tags: |
          type=raw,value=${{ github.sha }}
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        target: production
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta_backend.outputs.tags }}
        labels: ${{ steps.meta_backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push matchserver image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        target: matchserver-master
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta_matchserver.outputs.tags }}
        labels: ${{ steps.meta_matchserver.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./Frontend-admin
        target: production
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta_frontend.outputs.tags }}
        labels: ${{ steps.meta_frontend.outputs.labels }}
        build-args: |
          VITE_API_BASE_URL=http://localhost:3000
          VITE_WEBSOCKET_URL=ws://localhost:3001
          VITE_APP_NAME=QuizUP
          VITE_APP_VERSION=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Trivy image scan (backend)
      uses: aquasecurity/trivy-action@master
      if: always()
      with:
        scan-type: 'image'
        image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/quizup-backend:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-backend.sarif'

    - name: Upload Trivy backend scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-backend.sarif'

  deploy:
    name: Deploy (Docker Compose)
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_PATH != '' && secrets.GHCR_USERNAME != '' && secrets.GHCR_PAT != '' && secrets.ENV_STAGING_CONFIG != '' && secrets.ENV_PRODUCTION_CONFIG != '' }}
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          set -e
          mkdir -p "${{ secrets.DEPLOY_PATH }}"
          cd "${{ secrets.DEPLOY_PATH }}"
          if [ ! -d quizup ]; then
            git clone https://github.com/${{ github.repository }} quizup
          fi
          cd quizup
          git fetch --all
          git checkout ${{ github.ref_name }}
          git reset --hard ${{ github.sha }}

          export APP_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          export REGISTRY=${{ env.REGISTRY }}/${{ github.repository_owner }}
          export IMAGE_TAG=${{ github.sha }}

          mkdir -p configs/envs
          if [ "$APP_ENV" = "production" ]; then
            cat > configs/envs/.env.production.config << 'EOF'
${{ secrets.ENV_PRODUCTION_CONFIG }}
EOF
          else
            cat > configs/envs/.env.staging.config << 'EOF'
${{ secrets.ENV_STAGING_CONFIG }}
EOF
          fi

          chmod 600 configs/envs/.env.${APP_ENV}.config

          docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} -p ${{ secrets.GHCR_PAT }}
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          docker compose -f docker-compose.prod.yml ps

