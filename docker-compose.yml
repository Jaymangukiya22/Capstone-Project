# =============================================================================
# QUIZUP UNIFIED DOCKER COMPOSE
# Handles: localhost, network, production scaling
# Usage: docker-compose -f docker-compose.unified.yml up -d
# =============================================================================

# Docker Compose for QuizUP - Unified Configuration

services:
  # =============================================================================
  # DATABASE
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: quizup_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizup_db}
      POSTGRES_USER: ${POSTGRES_USER:-quizup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizup_password}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-5000}
    command: 
      - "postgres"
      - "-c"
      - "max_connections=5000"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - quizup_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizup_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-8G}

  # =============================================================================
  # REDIS CACHE
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: quizup_redis
    # NOTE: ./redis.conf at repo root is NOT mounted/used anywhere - this
    # command line is the actual live config. requirepass lives here, not
    # in that file (which is unused; its own commented-out requirepass line
    # was always a no-op).
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory ${REDIS_MAXMEMORY:-4gb} --maxmemory-policy allkeys-lru --tcp-backlog 511 --timeout 0 --tcp-keepalive 300
    volumes:
      - redis_data:/data
    # Previously published to 0.0.0.0, reachable from outside the Docker
    # network with no auth at all. backend/matchserver reach Redis via the
    # internal quizup_network by service name - the host port isn't needed
    # for normal operation. Bound to loopback only, for local debugging.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - quizup_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    mem_limit: ${REDIS_MEMORY_LIMIT:-4G}

  # =============================================================================
  # BACKEND API (Scalable)
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: quizup_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: backend  # log label; Promtail ships ./logs/backend to Loki
      DB_NAME: quizup_db
      DB_USER: quizup_user
      DB_PASSWORD: quizup_password
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-7a0b42e9df5856f7cfe0094361f65630}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-64}
      MIN_WORKERS: ${MIN_WORKERS:-1}
      MAX_WORKERS: ${MAX_WORKERS:-2}
      DB_POOL_MIN: ${DB_POOL_MIN:-20}
      DB_POOL_MAX: ${DB_POOL_MAX:-2000}
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      # Winston's console transport writes synchronously to stdout with no
      # buffering - fine for local dev, but adds I/O overhead under load in
      # production. Default off; set LOG_TO_CONSOLE=true to override.
      LOG_TO_CONSOLE: ${LOG_TO_CONSOLE:-false}
      ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-true}
      SEED_DATABASE: ${SEED_DATABASE:-true}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./logs/backend:/app/logs  # JSON logs, tailed by Promtail -> Loki
    networks:
      - quizup_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: ${BACKEND_CPU_LIMIT:-3.0}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-8G}

  # =============================================================================
  # MATCH SERVER (Scalable)
  # =============================================================================
  matchserver:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: matchserver-master
    # NOTE: deliberately NO `container_name` here (unlike the other
    # services). A fixed container_name collides across replicas and blocks
    # Compose scaling outright - `docker compose up -d --scale matchserver=N`
    # (N>1) fails immediately with "Conflict. The container name ... is
    # already in use". Without it, Compose auto-names each replica
    # (matchserver-1, matchserver-2, ...) and Docker's embedded DNS resolves
    # the *service* name `matchserver` to ALL replica IPs (see
    # `upstream matchserver_cluster` in nginx.conf, which now targets
    # `matchserver:3001` instead of the old fixed `quizup_matchserver:3001`).
    # Compose's default scale is 1, so plain `docker compose up -d` still
    # runs exactly one matchserver, same as before this change.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: matchserver  # log label; Promtail ships ./logs/matchserver to Loki
      # Unique per-replica identity used for cross-replica matchmaking
      # routing (backend reads process.env.SERVER_ID, default os.hostname()).
      # Left unset on purpose: each replica's container hostname (its own
      # container ID, assigned by Docker) is already unique, so the backend's
      # os.hostname() fallback gives every replica a distinct SERVER_ID with
      # zero extra wiring. Only set this explicitly if you need a stable,
      # human-readable ID across container restarts (e.g. for log
      # correlation) - and if you do, give each replica a DIFFERENT value.
      SERVER_ID: ${SERVER_ID:-}
      DB_NAME: quizup_db
      DB_USER: quizup_user
      DB_PASSWORD: quizup_password
      DB_HOST: postgres
      DB_PORT: 5432
      # Sequelize pool was previously hardcoded (ignored these entirely) -
      # now that it reads them, each matchserver worker process gets its own
      # pool, so keep it modest per-process (MAX_WORKERS x DB_POOL_MAX must
      # stay well under Postgres's max_connections above).
      DB_POOL_MIN: ${MATCHSERVER_DB_POOL_MIN:-5}
      DB_POOL_MAX: ${MATCHSERVER_DB_POOL_MAX:-50}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MATCH_SERVICE_PORT: 3001
      MASTER_HOST: 0.0.0.0
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-64}
      # Per-process V8 heap cap for the master + forked workers (see .env). Keeps
      # the 5 processes in this cgroup from each auto-sizing to the whole limit
      # and collectively OOMing. 1536 x 5 = 7.5G < the 8G mem_limit below.
      NODE_OPTIONS: ${MATCHSERVER_NODE_OPTIONS:---max-old-space-size=1536}
      # Worker Pool Configuration
      # RIGHT-SIZED FOR A 4-CORE / 16GB HOST.
      # Quiz matches are idle-heavy I/O state machines, NOT CPU hogs, so a
      # single Node process holds thousands of them fine. Forking one OS process
      # per ~8 matches (old: 500 workers) would need ~625 processes for 5k
      # matches and OOM the box. Instead: a few workers, each holding many.
      #   4 workers x 6000 matches = 24,000 match capacity (tuned up from
      #   4x2500=10k after the ceiling test showed ~88 MiB/1000 matches and flat
      #   event-loop lag - memory, raised to 8G below, is the real ceiling).
      # NOTE: do not set MAX_MATCHES here. The pool forks each worker with
      # MAX_MATCHES = MAX_MATCHES_PER_WORKER (enhancedWorkerPool.spawnWorker),
      # so a separate MAX_MATCHES env is dead config and previously contradicted
      # MAX_MATCHES_PER_WORKER (e.g. a stray MAX_MATCHES=3). Set only
      # MAX_MATCHES_PER_WORKER; the worker's own cap derives from it.
      MIN_WORKERS: ${MIN_WORKERS:-3}
      MAX_WORKERS: ${MAX_WORKERS:-4}
      MAX_MATCHES_PER_WORKER: ${MAX_MATCHES_PER_WORKER:-6000}
      WORKER_IDLE_TIMEOUT: ${WORKER_IDLE_TIMEOUT:-300000}
      # Scaling
      SCALE_UP_THRESHOLD: ${SCALE_UP_THRESHOLD:-0.5}
      SCALE_DOWN_THRESHOLD: ${SCALE_DOWN_THRESHOLD:-0.3}
      SCALE_CHECK_INTERVAL: ${SCALE_CHECK_INTERVAL:-5000}
      PROACTIVE_SPAWN_THRESHOLD: ${PROACTIVE_SPAWN_THRESHOLD:-0.6}
      # Stale-match reaper (force-terminates matches idle this long, and now
      # reconciles their Postgres row to CANCELLED - [M11]). Prod defaults;
      # override low to exercise the reaper quickly in a test.
      STALE_MATCH_TIMEOUT_MS: ${STALE_MATCH_TIMEOUT_MS:-300000}
      STALE_MATCH_CHECK_INTERVAL_MS: ${STALE_MATCH_CHECK_INTERVAL_MS:-60000}
      LOG_LEVEL: ${MATCHSERVER_LOG_LEVEL:-debug}
      # Winston's console transport writes synchronously to stdout with no
      # buffering - fine for local dev, but adds I/O overhead under load in
      # production. Default off; set LOG_TO_CONSOLE=true to override.
      LOG_TO_CONSOLE: ${LOG_TO_CONSOLE:-false}
    ports:
      # Published as a HOST PORT RANGE -> single container port 3001. At the
      # default scale of 1 (`docker compose up -d`), only
      # ${MATCH_SERVICE_PORT:-3001} is ever bound - identical to before this
      # change. When scaled (`docker compose up -d --scale matchserver=N`),
      # Compose hands each replica the next free host port in the range
      # (3001, 3002, ...) so they don't collide on the host; a single fixed
      # host port here would make replica #2+ fail to start with "port is
      # already allocated". Widen MATCH_SERVICE_PORT_MAX in .env for >10
      # replicas. Normal traffic reaches matchserver through nginx (see
      # nginx.conf), not this host-published port - it's for direct/local
      # debugging only.
      - "${MATCH_SERVICE_PORT:-3001}-${MATCH_SERVICE_PORT_MAX:-3010}:3001"
    # ADD VOLUMES FOR PERSISTENCE ✅
    volumes:
      - ./backend/src:/app/src:ro  # Source code (read-only)
      - ./backend/tests:/app/tests:ro  # Tests (read-only)
      - ./logs/matchserver:/app/logs  # JSON logs, tailed by Promtail -> Loki
    networks:
      - quizup_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: ${MATCHSERVER_CPU_LIMIT:-3.0}
    mem_limit: ${MATCHSERVER_MEMORY_LIMIT:-8G}
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  # =============================================================================
  # NGINX LOAD BALANCER
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: quizup_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
    networks:
      - quizup_network
    depends_on:
      - backend
      - matchserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: ${NGINX_CPU_LIMIT:-1.0}
    mem_limit: ${NGINX_MEMORY_LIMIT:-512M}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # =============================================================================
  # FRONTEND (Production Build with Nginx)
  # =============================================================================
  frontend:
    build:
      context: ./Frontend-admin
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090}
        VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-ws://localhost:8090/socket.io/}
        VITE_NETWORK_MODE: ${VITE_NETWORK_MODE:-false}
        VITE_APP_NAME: ${VITE_APP_NAME:-QuizUP}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
    container_name: quizup_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - quizup_network
    restart: unless-stopped
    # Production Nginx serving static content
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: ${FRONTEND_CPU_LIMIT:-0.25}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512M}

  # =============================================================================
  # DATABASE ADMIN (Optional)
  # =============================================================================
  adminer:
    image: adminer:latest
    container_name: quizup_adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - quizup_network
    restart: unless-stopped
    cpus: ${ADMINER_CPU_LIMIT:-0.25}
    mem_limit: ${ADMINER_MEMORY_LIMIT:-512M}

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: quizup_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-admin}
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    networks:
      - quizup_network
    depends_on:
      - redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: quizup_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - quizup_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Monitoring must stay lean on the 4-core/16GB host so it doesn't starve
    # the app it measures (audit: these previously had no limits at all).
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-1G}

  loki:
    image: grafana/loki:2.9.8
    container_name: quizup_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - quizup_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    cpus: ${LOKI_CPU_LIMIT:-0.5}
    mem_limit: ${LOKI_MEMORY_LIMIT:-512M}

  promtail:
    image: grafana/promtail:2.9.8
    container_name: quizup_promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/quizup:ro   # the apps' JSON log files (bind-mounted per service)
      - promtail_positions:/tmp
    networks:
      - quizup_network
    depends_on:
      - loki
    restart: unless-stopped
    cpus: ${PROMTAIL_CPU_LIMIT:-0.15}
    mem_limit: ${PROMTAIL_MEMORY_LIMIT:-128M}

  grafana:
    image: grafana/grafana-oss:9.5.18
    container_name: quizup_grafana
    ports:
      - "3003:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - quizup_network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    cpus: ${GRAFANA_CPU_LIMIT:-0.5}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512M}

  node-exporter:
    image: prom/node-exporter:latest
    container_name: quizup_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - quizup_network
    restart: unless-stopped
    cpus: ${NODE_EXPORTER_CPU_LIMIT:-0.15}
    mem_limit: ${NODE_EXPORTER_MEMORY_LIMIT:-128M}

  # Per-container CPU / memory / network bandwidth for EVERY service (postgres,
  # redis, backend, matchserver incl. its worker processes, nginx, ...). This
  # is what node-exporter (host-only) and the app/exporter metrics (DB-level,
  # or master-process-only for the match server) cannot give: uniform
  # per-service resource + bandwidth usage.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: quizup_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - quizup_network
    restart: unless-stopped
    cpus: ${CADVISOR_CPU_LIMIT:-0.3}
    mem_limit: ${CADVISOR_MEMORY_LIMIT:-256M}

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: quizup_postgres_exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-quizup_user}:${POSTGRES_PASSWORD:-quizup_password}@postgres:5432/${POSTGRES_DB:-quizup_db}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
    volumes:
      - ./monitoring/postgres-exporter:/etc/postgres_exporter:ro
    networks:
      - quizup_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    cpus: ${POSTGRES_EXPORTER_CPU_LIMIT:-0.15}
    mem_limit: ${POSTGRES_EXPORTER_MEMORY_LIMIT:-128M}

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: quizup_redis_exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://:${REDIS_PASSWORD}@redis:6379"
      REDIS_EXPORTER_LOG_FORMAT: "txt"
    networks:
      - quizup_network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    cpus: ${REDIS_EXPORTER_CPU_LIMIT:-0.15}
    mem_limit: ${REDIS_EXPORTER_MEMORY_LIMIT:-128M}

  alertmanager:
    image: prom/alertmanager:latest
    container_name: quizup_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - quizup_network
    restart: unless-stopped
    cpus: ${ALERTMANAGER_CPU_LIMIT:-0.15}
    mem_limit: ${ALERTMANAGER_MEMORY_LIMIT:-128M}

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  quizup_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  promtail_positions:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
