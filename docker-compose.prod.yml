services:
  postgres:
    image: postgres:15-alpine
    container_name: quizup_postgres
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - quizup_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quizup_redis
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - quizup_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${REGISTRY}/quizup-backend:${IMAGE_TAG}
    container_name: quizup_backend
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_TO_CONSOLE: ${LOG_TO_CONSOLE:-true}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - quizup_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  matchserver:
    image: ${REGISTRY}/quizup-matchserver:${IMAGE_TAG}
    # NOTE: deliberately NO `container_name` here (unlike the other
    # services) - mirrors docker-compose.yml. A fixed container_name
    # collides across replicas and blocks `docker compose -f
    # docker-compose.prod.yml up -d --scale matchserver=N`. Without it,
    # Compose auto-names each replica and Docker's embedded DNS resolves the
    # *service* name `matchserver` to ALL replica IPs (nginx.conf's
    # `upstream matchserver_cluster` targets `matchserver:3001`, not the old
    # fixed `quizup_matchserver:3001`). Default scale is 1, so plain `up -d`
    # still runs exactly one matchserver, same as before.
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # Shared Redis (same instance/URL as the backend service below) - this
      # is how replicas coordinate: socket.io's Redis adapter plus a
      # Redis-backed matchmaking queue let matches split across replicas
      # find each other without any replica-to-replica networking.
      REDIS_URL: redis://redis:6379
      MATCH_SERVICE_PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_TO_CONSOLE: ${LOG_TO_CONSOLE:-true}
      # Unique per-replica identity for cross-replica matchmaking routing
      # (backend reads process.env.SERVER_ID, default os.hostname()). Left
      # unset on purpose: each replica's container hostname (its own
      # Docker-assigned container ID) is already unique, so the backend's
      # os.hostname() fallback is enough. Set explicitly only for a stable,
      # human-readable ID - and give each replica a DIFFERENT value if so.
      SERVER_ID: ${SERVER_ID:-}
    ports:
      # HOST PORT RANGE -> single container port, same rationale as
      # docker-compose.yml: at scale=1 only ${MATCH_SERVICE_PORT:-3001} is
      # bound (unchanged behavior); scaling assigns each replica the next
      # free port in the range instead of colliding on a fixed host port.
      - "${MATCH_SERVICE_PORT:-3001}-${MATCH_SERVICE_PORT_MAX:-3010}:3001"
    networks:
      - quizup_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: quizup_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
    networks:
      - quizup_network
    depends_on:
      - backend
      - matchserver
    restart: unless-stopped

  frontend:
    image: ${REGISTRY}/quizup-frontend:${IMAGE_TAG}
    container_name: quizup_frontend
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - quizup_network
    restart: unless-stopped

networks:
  quizup_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
