services:
  postgres:
    image: postgres:15-alpine
    container_name: quizup_postgres
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - quizup_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quizup_redis
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - quizup_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${REGISTRY}/quizup-backend:${IMAGE_TAG}
    container_name: quizup_backend
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - quizup_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  matchserver:
    image: ${REGISTRY}/quizup-matchserver:${IMAGE_TAG}
    container_name: quizup_matchserver
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      MATCH_SERVICE_PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${MATCH_SERVICE_PORT:-3001}:3001"
    networks:
      - quizup_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: quizup_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
    networks:
      - quizup_network
    depends_on:
      - backend
      - matchserver
    restart: unless-stopped

  frontend:
    image: ${REGISTRY}/quizup-frontend:${IMAGE_TAG}
    container_name: quizup_frontend
    env_file:
      - ./configs/envs/.env.${APP_ENV}.config
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - quizup_network
    restart: unless-stopped

networks:
  quizup_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
