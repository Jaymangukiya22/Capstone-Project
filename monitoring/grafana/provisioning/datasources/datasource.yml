apiVersion: 1

# Clean rebuild: only the two datasources the dashboard actually uses. The
# previous file also declared a redis-datasource and a golioth-websocket
# datasource that require external Grafana plugins (not installed) and were
# unused - removed.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    isDefault: false
    editable: true
